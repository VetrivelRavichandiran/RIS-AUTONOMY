[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="ris-autonomy"
version="0.1.0"
requires-python=">=3.11"
dependencies=[
    "numpy>=2",
    "scipy>=1.17",
    "gymnasium>=1.3",
    "stable-baselines3>=2.9",
    "pyyaml>=6",
    "pandas>=3",
    "matplotlib>=3",
    "streamlit>=1.64",
    "plotly>=7",
    "pyarrow>=15",
    "tensorboard>=2",
]
[tool.setuptools.packages.find]
where=["src"]
[tool.pytest.ini_options]
testpaths=["tests"]
[tool.ruff]
line-length=100
