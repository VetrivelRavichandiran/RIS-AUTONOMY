# RIS-AUTONOMY benchmark scenario (five-controller comparison).
# 4x4 RIS (16 elements), 2 users (forced), static.  Direct link blocked so the RIS path
# is the useful one.  Small network + short rollouts keep training quick.
system:
  carrier_frequency_hz: 28000000000.0
  bandwidth_hz: 100000000.0
  transmit_power_dbm: 30
  noise_figure_db: 5
  modulation: qpsk
  ris_element_power_w: 0.005
  bs_circuit_power_w: 0.0
bs:
  antennas: 4
ris:
  rows: 4
  columns: 4
  phase_bits: 2
  amplitude: 1.0
  switching_cost: 0.1
users:
  count: 1
  mobility: static
  velocity_mps: 2.0
scenario:
  boundary_width_m: 100
  boundary_height_m: 100
  bs_position: [0.0, 0.0]
  ris_position: [50.0, 50.0]
  ue_region: [10.0, 10.0, 90.0, 90.0]
channel:
  model: 3gpp_um
  fading: rician
  rician_k_db: 10.0
  pathloss_exponent: 2.5
  csi_error: 0.0
  direct_link: blocked
  blockage_db: 40.0
state:
  components:
    direct_magnitude: true
    direct_phase: true
    effective_magnitude: true
    effective_phase: true
    sinr: true
    rate: true
    position: true
    velocity: true
    current_phase: true
    previous_phase: true
    snr: true
    csi_quality: true
    interference: true
rl:
  timesteps: 5000
  n_steps_per_episode: 50
  net_arch: small
  n_steps: 128
  batch_size: 64
  n_epochs: 2
experiment:
  seed: 42
  episodes: 3
  csi_error_sweep: [0, 0.05, 0.1, 0.2, 0.3]
benchmark:
  drl_model_path: null
  train_drl_if_missing: true
  drl_timesteps_if_missing: 5000
  episodes: 5